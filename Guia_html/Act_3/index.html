<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiz Interactivo de Práctica</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .quiz-container { background: white; padding: 20px; border-radius: 10px; max-width: 500px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .opcion { display: block; width: 100%; padding: 10px; margin: 5px 0; background: #e0e0e0; border: none; border-radius: 5px; cursor: pointer; text-align: left; }
        .opcion:hover { background: #d0d0d0; }
        #retroalimentacion { margin-top: 15px; padding: 10px; border-radius: 5px; display: none; }
        .correcto { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrecto { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h3>1. ¿Cuál es la función de JavaScript al integrarse al HTML?</h3>
    <!-- Botones con un evento 'onclick' que llama a la función de JavaScript -->
    <button class="opcion" onclick="verificarRespuesta('A')">A) Dar estilo, color y diseño visual.</button>
    <button class="opcion" onclick="verificarRespuesta('B')">B) Agregar interacción y dinamismo como clics y validación.</button>
    <button class="opcion" onclick="verificarRespuesta('C')">C) Estructurar textos e imágenes.</button>

    <!-- Aquí aparecerá el comentario dinámico -->
    <div id="retroalimentacion"></div>
</div>

<script>
    // Esta función se ejecuta cuando el alumno hace clic en un botón
    function verificarRespuesta(opcionSeleccionada) {
        const cuadroFeedback = document.getElementById('retroalimentacion');
        cuadroFeedback.style.display = 'block'; // Hace visible el cuadro
        
        // Evalúa qué botón se presionó para dar un mensaje específico
        if (opcionSeleccionada === 'A') {
            cuadroFeedback.className = 'incorrecto';
            cuadroFeedback.innerHTML = "¡Cuidado! Esa es la función de <strong>CSS</strong>. CSS se encarga del diseño visual.";
        } else if (opcionSeleccionada === 'B') {
            cuadroFeedback.className = 'correcto';
            cuadroFeedback.innerHTML = "¡Excelente! <strong>JavaScript</strong> es el encargado de dar vida y dinamismo a la página.";
        } else if (opcionSeleccionada === 'C') {
            cuadroFeedback.className = 'incorrecto';
            cuadroFeedback.innerHTML = "Revisa de nuevo. Esa es la función del <strong>HTML</strong> básico.";
        }
    }
</script>

</body>
</html>
