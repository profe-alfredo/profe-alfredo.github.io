
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de MRU</title>

    <!-- Aquí se conectará el archivo CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Explorando el movimiento</h1>
        <p>Aprendamos Física mediante la web.</p>
    </header>

    <main>
        <section>
            <h2>¿Qué es el MRU?</h2>
            <p>
                El movimiento rectilíneo uniforme ocurre cuando
                un objeto se desplaza en línea recta con velocidad
                constante.
            </p>
        </section>

        <section>
            <h2>La relación entre distancia, velocidad y tiempo</h2>
            <p>La distancia recorrida se calcula mediante:</p>
            <p>d = v × t</p>
        </section>
    </main>

    <!-- Aquí se conectará el archivo JavaScript -->
    <script src="script.js"></script>
</body>
