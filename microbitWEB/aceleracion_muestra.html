<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>micro:bit — Flasheo USB y Captura de Movimiento</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      background: #18181b;
      color: #f4f4f5;
    }
    .panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    
    .btn-flash { background: #8b5cf6; color: #fff; }
    .btn-flash:hover:not(:disabled) { background: #7c3aed; }

    .btn-connect { background: #2563eb; color: #fff; }
    .btn-stream { background: #3f3f46; color: #fff; }
    .btn-stream.active { background: #059669; }
    
    .btn-record { background: #f59e0b; color: #18181b; }
    .btn-record.recording {
      background: #ef4444;
      color: #fff;
      animation: pulse 1s infinite alternate;
    }
    
    @keyframes pulse {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(1.03); opacity: 0.85; }
    }

    .status-text {
      font-size: 14px;
      font-weight: 500;
      color: #a1a1aa;
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    progress {
      width: 220px;
      height: 12px;
      accent-color: #8b5cf6;
    }

    .readings {
      display: flex;
      gap: 24px;
      margin-bottom: 12px;
      font-family: monospace;
      font-size: 18px;
    }
    .axis-x { color: #f87171; }
    .axis-y { color: #4ade80; }
    .axis-z { color: #60a5fa; }

    canvas {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>

  <h2>micro:bit — Flasheo USB, Monitor y Captura de Movimiento</h2>

  <div class="panel">
    <!-- Programación WebUSB -->
    <button id="flashBtn" class="btn-flash">⚡ Programar micro:bit (USB)</button>

    <!-- Conexión Bluetooth -->
    <button id="connectBtn" class="btn-connect">1. Conectar Bluetooth</button>
    <button id="streamBtn" class="btn-stream" disabled>2. Pausar Gráfica</button>
    <button id="recordBtn" class="btn-record" disabled>⏺ Grabar Muestra (3s)</button>
    
    <span id="recordStatus" class="status-text">Sin conectar</span>
  </div>

  <div id="flashProgressArea" class="progress-container" style="display: none;">
    <progress id="flashProgressBar" value="0" max="100"></progress>
    <span id="flashStatus" class="status-text">Listo</span>
  </div>

  <div class="readings">
    <span class="axis-x">X: <span id="valX">0</span> mg</span>
    <span class="axis-y">Y: <span id="valY">0</span> mg</span>
    <span class="axis-z">Z: <span id="valZ">0</span> mg</span>
  </div>

  <canvas id="grafica" width="720" height="280"></canvas>

<script>
// ==========================================================
// 1. CONTROLADOR WEBUSB NATIVO (ADAPTADO DE CREATEAI)
// ==========================================================
const flashBtn = document.getElementById('flashBtn');
const flashStatus = document.getElementById('flashStatus');
const flashProgressArea = document.getElementById('flashProgressArea');
const flashProgressBar = document.getElementById('flashProgressBar');

// Clase de transporte WebUSB idéntica a Hz de CreateAI (interfaceClass === 255)
class MicrobitUSBTransport {
  constructor(device) {
    this.device = device;
    this.interfaceNumber = undefined;
    this.endpointIn = undefined;
    this.endpointOut = undefined;
  }

  get isOpen() { return this.interfaceNumber !== undefined; }

  async open() {
    if (this.isOpen) return;
    await this.device.open();
    await this.device.selectConfiguration(1);

    // Filtro seguro: interfaz de vendedor (Class 255)
    const validInterfaces = this.device.configuration.interfaces.filter(
      i => i.alternates[0].interfaceClass === 255
    );

    if (!validInterfaces.length) {
      throw new Error("No se encontró la interfaz WebUSB (Class 255). Actualiza el firmware de la placa.");
    }

    const selected = validInterfaces.find(i => i.alternates[0].endpoints.length > 0) || validInterfaces[0];
    this.interfaceNumber = selected.interfaceNumber;

    const endpoints = selected.alternates[0].endpoints;
    this.endpointIn = undefined;
    this.endpointOut = undefined;

    for (const ep of endpoints) {
      if (ep.direction === "in" && !this.endpointIn) this.endpointIn = ep;
      else if (ep.direction === "out" && !this.endpointOut) this.endpointOut = ep;
    }

    await this.device.claimInterface(this.interfaceNumber);
  }

  async close() {
    if (!this.isOpen) return;
    try { await this.device.releaseInterface(this.interfaceNumber); } catch (_) {}
    this.interfaceNumber = undefined;
    this.endpointIn = undefined;
    this.endpointOut = undefined;
    try { await this.device.close(); } catch (_) {}
  }

  async read() {
    let res;
    if (this.endpointIn) {
      res = await this.device.transferIn(this.endpointIn.endpointNumber, 64);
    } else {
      res = await this.device.controlTransferIn({
        requestType: "class",
        recipient: "interface",
        request: 1,
        value: 256,
        index: this.interfaceNumber
      }, 64);
    }
    if (res.status !== "ok" || !res.data) throw new Error("Fallo en lectura USB");
    return res.data;
  }

  async write(data) {
    const packet = new Uint8Array(64);
    packet.set(data.subarray(0, 64));
    if (this.endpointOut) {
      await this.device.transferOut(this.endpointOut.endpointNumber, packet);
    } else {
      await this.device.controlTransferOut({
        requestType: "class",
        recipient: "interface",
        request: 9,
        value: 512,
        index: this.interfaceNumber
      }, packet);
    }
  }
}

async function sendDapCommand(transport, cmd, payload) {
  let packet;
  if (payload) {
    packet = new Uint8Array(payload.length + 1);
    packet[0] = cmd;
    packet.set(payload, 1);
  } else {
    packet = new Uint8Array([cmd]);
  }

  await transport.write(packet);
  const res = await transport.read();

  if (res.getUint8(0) !== cmd) {
    throw new Error(`Respuesta inválida para comando ${cmd} -> ${res.getUint8(0)}`);
  }
  return res;
}

// Analizador y extractor de arquitectura Intel HEX / Universal HEX
function prepararHexParaPlaca(hexTexto, serialNumber) {
  const prefijo = (serialNumber || "").slice(0, 4);
  const esV2 = ["9903", "9904", "9905", "9906"].includes(prefijo);
  const esV1 = ["9900", "9901"].includes(prefijo);

  // 1. Si es Universal HEX (tiene múltiples bloques separados por :00000001FF)
  const partes = hexTexto.split(":00000001FF");
  if (partes.length > 2) {
    for (const bloque of partes) {
      const bLimpio = bloque.trim();
      if (!bLimpio) continue;

      const tieneV2 = bLimpio.includes(":0400000A9903") ||
                      bLimpio.includes(":0400000A9904") ||
                      bLimpio.includes(":0400000A9905") ||
                      bLimpio.includes(":0400000A9906");

      const tieneV1 = bLimpio.includes(":0400000A9900") ||
                      bLimpio.includes(":0400000A9901");

      if (esV2 && tieneV2) return bLimpio + "\r\n:00000001FF\r\n";
      if (esV1 && tieneV1) return bLimpio + "\r\n:00000001FF\r\n";
    }
  }

  // 2. Si es un archivo de arquitectura única, verificar compatibilidad
  if (esV2 && (hexTexto.includes(":0400000A9900") || hexTexto.includes(":0400000A9901"))) {
    throw new Error(
      `Discrepancia de hardware (Target Mismatch): Tu micro:bit es V2.2 (${prefijo}), pero el archivo .hex que tienes cargado fue compilado exclusivamente para micro:bit V1 (9900). Debes descargar el firmware desde MakeCode para V2.`
    );
  }

  if (esV1 && (hexTexto.includes(":0400000A9903") || hexTexto.includes(":0400000A9904") || hexTexto.includes(":0400000A9905") || hexTexto.includes(":0400000A9906"))) {
    throw new Error(
      `Discrepancia de hardware (Target Mismatch): Tu micro:bit es V1 (${prefijo}), pero el archivo fue compilado para V2.`
    );
  }

  return hexTexto.trim() + "\r\n";
}

// Rutina de flasheo equivalente a HV de CreateAI
async function ejecutarFlasheoCreateAI(device, hexString, onProgress) {
  const transport = new MicrobitUSBTransport(device);
  await transport.open();

  const CMD_RESET = 137;       // 0x89
  const CMD_FLASH_OPEN = 138;  // 0x8A
  const CMD_FLASH_CLOSE = 139; // 0x8B
  const CMD_FLASH_WRITE = 140; // 0x8C
  const STATUS_OK = 0;
  const STATUS_DONE = 18;      // 0x12 -> ERROR_HEX_REST / Finalización exitosa
  const CHUNK_SIZE = 62;

  const enc = new TextEncoder();
  const hexBytes = enc.encode(hexString);
  const totalBytes = hexBytes.byteLength;

  try {
    // 1. Abrir sesión Flash
    const openPayload = new Uint8Array(new Uint32Array([1]).buffer);
    const openRes = await sendDapCommand(transport, CMD_FLASH_OPEN, openPayload);
    if (openRes.getUint8(1) !== STATUS_OK) {
      throw new Error(`DAPLink Flash Open falló (status: ${openRes.getUint8(1)})`);
    }

    // 2. Transferencia de fragmentos del archivo HEX
    let offset = 0;
    while (offset < totalBytes) {
      const nextOffset = Math.min(totalBytes, offset + CHUNK_SIZE);
      const chunk = hexBytes.slice(offset, nextOffset);

      const writePayload = new Uint8Array(chunk.byteLength + 1);
      writePayload[0] = chunk.byteLength;
      writePayload.set(new Uint8Array(chunk), 1);

      const writeRes = await sendDapCommand(transport, CMD_FLASH_WRITE, writePayload);
      offset = nextOffset;

      if (onProgress) onProgress(offset / totalBytes);

      const status = writeRes.getUint8(1);
      if (status === STATUS_DONE) {
        break; // Flasheo completado con éxito
      } else if (status === 19) {
        throw new Error("Target Mismatch (Status 19): La micro:bit rechazó el archivo porque no corresponde a su versión de procesador.");
      } else if (status !== STATUS_OK) {
        throw new Error(`Error en Flash Write (status: ${status})`);
      }
    }

    if (onProgress) onProgress(1);

    // 3. Cerrar sesión Flash
    const closeRes = await sendDapCommand(transport, CMD_FLASH_CLOSE);
    if (closeRes.getUint8(1) !== STATUS_OK && closeRes.getUint8(1) !== STATUS_DONE) {
      console.warn("Aviso en Flash Close:", closeRes.getUint8(1));
    }

    // 4. Reinicio del microcontrolador
    await sendDapCommand(transport, CMD_RESET);

  } finally {
    await transport.close();
  }
}

flashBtn.addEventListener('click', async () => {
  let device = null;
  try {
    flashBtn.disabled = true;
    flashProgressArea.style.display = "flex";
    flashProgressBar.value = 0;
    flashStatus.textContent = "Selecciona tu micro:bit en la ventana emergente...";

    // 1. Selector WebUSB (Vendor ID oficial 0x0d28)
    device = await navigator.usb.requestDevice({
      filters: [{ vendorId: 0x0d28 }]
    });

    // 2. Descargar el archivo .hex local
    flashStatus.textContent = "Cargando archivo .hex...";
    let response = await fetch('./firmware.hex');
    if (!response.ok) {
      response = await fetch('./microbit-Bluetooth-Control.hex');
    }
    if (!response.ok) {
      throw new Error("No se encontró 'firmware.hex' ni 'microbit-Bluetooth-Control.hex' en la carpeta.");
    }
    const hexCrudo = await response.text();

    // 3. Validar arquitectura y preparar el archivo para tu placa V2.2 (9906)
    flashStatus.textContent = "Verificando arquitectura de hardware...";
    const hexAjustado = prepararHexParaPlaca(hexCrudo, device.serialNumber);

    // 4. Ejecución del flasheo
    flashStatus.textContent = "Flasheando micro:bit...";
    await ejecutarFlasheoCreateAI(device, hexAjustado, (progress) => {
      const porcentaje = Math.round(progress * 100);
      flashProgressBar.value = porcentaje;
      flashStatus.textContent = `Flasheando firmware... ${porcentaje}%`;
    });

    flashProgressBar.value = 100;
    flashStatus.textContent = "¡micro:bit programado con éxito!";
    alert("¡micro:bit programado con éxito por USB!");
  } catch (error) {
    console.error("Error al flashear por USB:", error);
    flashStatus.textContent = "Error: " + error.message;
    alert("Fallo al programar: " + error.message);
  } finally {
    flashBtn.disabled = false;
  }
});


// ==========================================
// 2. COMUNICACIÓN BLE (ACELERÓMETRO NATIVO)
// ==========================================
const ACCEL_SERVICE_UUID = 'e95d0753-251d-470a-a062-fa1922dfa9a8';
const ACCEL_DATA_CHAR_UUID = 'e95dca4b-251d-470a-a062-fa1922dfa9a8';
const ACCEL_PERIOD_CHAR_UUID = 'e95dfb24-251d-470a-a062-fa1922dfa9a8';

let dataCharacteristic;
let streaming = true;

let grabacionActiva = false;
let bufferMuestras = [];
let tiempoInicioMs = 0;
const DURACION_GRABACION_MS = 3000;

const MAX_PUNTOS = 160;
const puntosX = new Array(MAX_PUNTOS).fill(0);
const puntosY = new Array(MAX_PUNTOS).fill(0);
const puntosZ = new Array(MAX_PUNTOS).fill(0);

const connectBtn = document.getElementById('connectBtn');
const streamBtn = document.getElementById('streamBtn');
const recordBtn = document.getElementById('recordBtn');
const recordStatus = document.getElementById('recordStatus');

connectBtn.addEventListener('click', async () => {
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "BBC micro:bit" }],
      optionalServices: [ACCEL_SERVICE_UUID]
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(ACCEL_SERVICE_UUID);

    try {
      const periodChar = await service.getCharacteristic(ACCEL_PERIOD_CHAR_UUID);
      await periodChar.writeValue(new Uint16Array([20])); // 20 ms
    } catch (e) {
      console.warn("Frecuencia predeterminada mantenida:", e);
    }

    dataCharacteristic = await service.getCharacteristic(ACCEL_DATA_CHAR_UUID);
    await dataCharacteristic.startNotifications();
    dataCharacteristic.addEventListener('characteristicvaluechanged', onLecturaAcelerometro);

    streamBtn.disabled = false;
    streamBtn.classList.add('active');
    recordBtn.disabled = false;
    recordStatus.textContent = "Listo para capturar";
    alert("¡Conexión BLE establecida!");
  } catch (err) {
    console.error("Error BLE:", err);
    alert("Fallo al conectar BLE: " + err.message);
  }
});

function onLecturaAcelerometro(event) {
  const dataView = event.target.value;
  const x = dataView.getInt16(0, true);
  const y = dataView.getInt16(2, true);
  const z = dataView.getInt16(4, true);

  if (grabacionActiva) {
    const tiempoRelativo = Math.round(performance.now() - tiempoInicioMs);
    bufferMuestras.push({ t: tiempoRelativo, x, y, z });
  }

  if (streaming) {
    document.getElementById('valX').textContent = x;
    document.getElementById('valY').textContent = y;
    document.getElementById('valZ').textContent = z;

    puntosX.push(x); puntosX.shift();
    puntosY.push(y); puntosY.shift();
    puntosZ.push(z); puntosZ.shift();
  }
}

recordBtn.addEventListener('click', () => {
  if (grabacionActiva) return;

  grabacionActiva = true;
  bufferMuestras = [];
  tiempoInicioMs = performance.now();

  recordBtn.disabled = true;
  recordBtn.classList.add('recording');
  recordBtn.textContent = "Grabando...";

  let segundosRestantes = 3;
  recordStatus.textContent = `Grabando movimiento... (${segundosRestantes}s)`;

  const intervalId = setInterval(() => {
    segundosRestantes--;
    if (segundosRestantes > 0) {
      recordStatus.textContent = `Grabando movimiento... (${segundosRestantes}s)`;
    } else {
      clearInterval(intervalId);
    }
  }, 1000);

  setTimeout(() => {
    grabacionActiva = false;
    recordBtn.disabled = false;
    recordBtn.classList.remove('recording');
    recordBtn.textContent = "⏺ Grabar Muestra (3s)";
    recordStatus.textContent = `Captura terminada (${bufferMuestras.length} muestras). Descargando CSV...`;

    exportarACSV(bufferMuestras);
  }, DURACION_GRABACION_MS);
});

function exportarACSV(muestras) {
  if (!muestras || muestras.length === 0) {
    alert("No se capturaron datos durante el intervalo.");
    return;
  }

  let contenidoCsv = "timestamp_ms,x_mg,y_mg,z_mg\r\n";
  for (const fila of muestras) {
    contenidoCsv += `${fila.t},${fila.x},${fila.y},${fila.z}\r\n`;
  }

  const blob = new Blob([contenidoCsv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const enlace = document.createElement("a");

  const fechaIso = new Date().toISOString().replace(/[:.]/g, "-");
  enlace.setAttribute("href", url);
  enlace.setAttribute("download", `microbit_muestra_${fechaIso}.csv`);
  document.body.appendChild(enlace);

  enlace.click();
  document.body.removeChild(enlace);
  URL.revokeObjectURL(url);
}

streamBtn.addEventListener('click', () => {
  streaming = !streaming;
  if (streaming) {
    streamBtn.textContent = "2. Pausar Gráfica";
    streamBtn.classList.add('active');
  } else {
    streamBtn.textContent = "2. Reanudar Gráfica";
    streamBtn.classList.remove('active');
  }
});

// Renderizado continuo en Canvas (60 FPS)
const canvas = document.getElementById('grafica');
const ctx = canvas.getContext('2d');

function trazar(datos, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();

  const paso = canvas.width / (MAX_PUNTOS - 1);
  const centroY = canvas.height / 2;
  const escala = (canvas.height / 2) / 2048;

  for (let i = 0; i < datos.length; i++) {
    const px = i * paso;
    const py = centroY - (datos[i] * escala);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#27272a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, canvas.height / 2);
  ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();

  trazar(puntosX, '#f87171');
  trazar(puntosY, '#4ade80');
  trazar(puntosZ, '#60a5fa');

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
