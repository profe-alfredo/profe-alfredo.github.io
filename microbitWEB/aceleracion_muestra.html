<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>micro:bit — Compilador Dinámico MakeCode</title>
  <!-- Driver WebUSB DAPjs oficial -->
  <script src="https://cdn.jsdelivr.net/npm/dapjs/dist/dap.umd.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      background: #18181b;
      color: #f4f4f5;
    }
    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #8b5cf6;
      color: #fff;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .status { margin-top: 15px; font-size: 14px; color: #a1a1aa; }
    progress { width: 260px; height: 12px; accent-color: #8b5cf6; margin-top: 10px; }
    
    /* El iframe debe tener dimensiones reales fuera de pantalla para que Chrome no congele el hilo */
    #makecodeIframe {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 300px;
      height: 300px;
      border: 0;
    }
  </style>
</head>
<body>

  <h2>Compilador y Flasheador Dinámico micro:bit</h2>
  
  <button id="btnCompilarFlashear" disabled>1. Esperando motor MakeCode...</button>
  <div id="progresoContainer" style="display:none;">
    <progress id="progressBar" value="0" max="100"></progress>
  </div>
  <p id="txtEstado" class="status">Iniciando motor MakeCode en segundo plano...</p>

  <!-- Iframe en modo controller -->
  <iframe id="makecodeIframe" src="https://makecode.microbit.org/?controller=1"></iframe>

<script>
const MAKECODE_ORIGIN = "https://makecode.microbit.org";
const iframe = document.getElementById("makecodeIframe");
const btn = document.getElementById("btnCompilarFlashear");
const txtEstado = document.getElementById("txtEstado");
const progressBar = document.getElementById("progressBar");
const progresoContainer = document.getElementById("progresoContainer");

let editorListo = false;
let resolverCompilacion = null;

// ==========================================
// 1. HANDSHAKE Y PROTOCOLO PXT CONTROLLER
// ==========================================
window.addEventListener("message", (event) => {
  if (!event.origin.includes("makecode.microbit.org")) return;

  const data = event.data;
  if (!data || data.type !== "pxteditor") return;

  console.log("[MakeCode Recibido]", data.action);

  // PASO CLAVE: Responder a workspacesync para desbloquear la carga de MakeCode
  if (data.action === "workspacesync") {
    console.log("-> Desbloqueando MakeCode con respuesta workspacesync...");
    event.source.postMessage({
      type: "pxteditor",
      action: "workspacesync",
      success: true,
      projects: [] // Indicamos que no hay proyectos previos en cola
    }, event.origin);
    return;
  }

  // MakeCode ya cargó su entorno y está listo para compilar
  if (data.action === "editorready" || data.action === "workspaceloaded") {
    if (!editorListo) {
      editorListo = true;
      btn.disabled = false;
      btn.textContent = "⚡ Compilar y Programar micro:bit (USB)";
      txtEstado.textContent = "Motor de compilación listo.";
      console.log("-> MakeCode listo para recibir peticiones de compilación.");
    }
    return;
  }

  // Recepción del archivo .HEX compilado
  if (data.action === "compile") {
    if (resolverCompilacion) {
      resolverCompilacion(data);
      resolverCompilacion = null;
    }
  }
});

// ==========================================
// 2. PETICIÓN DE COMPILACIÓN AL IFRAME
// ==========================================
function compilarCodigoMakeCode(codigoTypeScript) {
  return new Promise((resolve, reject) => {
    if (!editorListo) {
      return reject(new Error("MakeCode aún no está listo."));
    }

    resolverCompilacion = (res) => {
      if (res.success && res.outfiles && res.outfiles["binary.hex"]) {
        resolve(res.outfiles["binary.hex"]);
      } else {
        console.error("Fallo de compilación:", res);
        reject(new Error("MakeCode no pudo generar el binario HEX."));
      }
    };

    // Estructura del proyecto TypeScript configurado sin emparejamiento PIN
    const proyecto = {
      files: {
        "main.ts": codigoTypeScript,
        "pxt.json": JSON.stringify({
          name: "microbit-dynamic-firmware",
          dependencies: {
            "core": "*",
            "bluetooth": "*"
          },
          yotta: {
            config: {
              "microbit-dal": {
                "bluetooth": {
                  "pairing_mode": 0 // No Pairing Required
                }
              }
            }
          }
        })
      }
    };

    iframe.contentWindow.postMessage({
      type: "pxteditor",
      action: "compile",
      project: proyecto,
      response: true
    }, MAKECODE_ORIGIN);
  });
}

// ==========================================
// 3. FLASHEO WEBUSB MEDIANTE DAPJS
// ==========================================
btn.addEventListener("click", async () => {
  let device = null;
  let target = null;

  try {
    btn.disabled = true;
    progresoContainer.style.display = "block";
    progressBar.value = 0;
    txtEstado.textContent = "Selecciona tu micro:bit en la ventana emergente...";

    // 1. Solicitar dispositivo USB (Vendor ID oficial 0x0d28)
    device = await navigator.usb.requestDevice({
      filters: [{ vendorId: 0x0d28 }]
    });

    // 2. Compilar al vuelo el código del sensor
    const scriptTypeScript = `
bluetooth.startAccelerometerService()
basic.showIcon(IconNames.Heart)
`;

    txtEstado.textContent = "Compilando firmware Universal HEX con MakeCode...";
    const hexGenerado = await compilarCodigoMakeCode(scriptTypeScript);

    // 3. Conectar al chip DAPLink por WebUSB
    txtEstado.textContent = "Conectando al micro:bit por USB...";
    const DAP = window.DAPjs || window.dapjs;
    const transport = new DAP.WebUSB(device);
    target = new DAP.DAPLink(transport);

    target.on("progress", (p) => {
      const porcentaje = Math.round(p * 100);
      progressBar.value = porcentaje;
      txtEstado.textContent = `Flasheando micro:bit... ${porcentaje}%`;
    });

    await target.connect();

    txtEstado.textContent = "Escribiendo en memoria Flash...";
    const enc = new TextEncoder();
    await target.flash(enc.encode(hexGenerado));

    progressBar.value = 100;
    txtEstado.textContent = "¡micro:bit programado con éxito!";
    alert("¡micro:bit programado con éxito!");
  } catch (err) {
    console.error("Error:", err);
    txtEstado.textContent = "Error: " + err.message;
    alert("Error durante la operación: " + err.message);
  } finally {
    if (target) {
      try { await target.disconnect(); } catch (e) {}
    }
    if (device && device.opened) {
      try { await device.close(); } catch (e) {}
    }
    btn.disabled = false;
  }
});
</script>
</body>
</html>
