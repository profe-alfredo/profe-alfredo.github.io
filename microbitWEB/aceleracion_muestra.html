<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>micro:bit — Compilador Dinámico MakeCode</title>
  <!-- Driver WebUSB DAPjs -->
  <script src="https://cdn.jsdelivr.net/npm/dapjs/dist/dap.umd.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      background: #18181b;
      color: #f4f4f5;
    }
    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #8b5cf6;
      color: #fff;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .status { margin-top: 15px; font-size: 14px; color: #a1a1aa; }
    progress { width: 260px; height: 12px; accent-color: #8b5cf6; margin-top: 10px; }
    /* Iframe de compilación oculto */
    #makecodeIframe { display: none; }
  </style>
</head>
<body>

  <h2>Compilador y Flasheador Dinámico micro:bit</h2>
  
  <button id="btnCompilarFlashear" disabled>1. Esperando motor MakeCode...</button>
  <div id="progresoContainer" style="display:none;">
    <progress id="progressBar" value="0" max="100"></progress>
  </div>
  <p id="txtEstado" class="status">Cargando MakeCode en segundo plano...</p>

  <!-- Iframe oficial configurado en modo controlador -->
  <iframe id="makecodeIframe" src="https://makecode.microbit.org/?controller=1&readonly=1"></iframe>

<script>
const MAKECODE_ORIGIN = "https://makecode.microbit.org";
const iframe = document.getElementById("makecodeIframe");
const btn = document.getElementById("btnCompilarFlashear");
const txtEstado = document.getElementById("txtEstado");
const progressBar = document.getElementById("progressBar");
const progresoContainer = document.getElementById("progresoContainer");

let editorListo = false;
let resolverCompilacion = null;

// 1. Escuchar eventos del Iframe de MakeCode
window.addEventListener("message", (event) => {
  if (event.origin !== MAKECODE_ORIGIN) return;

  const data = event.data;
  if (!data || data.type !== "pxteditor") return;

  // MakeCode terminó de cargar su entorno en memoria
  if (data.action === "editorready") {
    editorListo = true;
    btn.disabled = false;
    btn.textContent = "⚡ Compilar y Programar micro:bit (USB)";
    txtEstado.textContent = "Motor de compilación listo.";
  }

  // MakeCode devuelve el resultado de la compilación
  if (data.action === "compile") {
    if (resolverCompilacion) {
      resolverCompilacion(data);
      resolverCompilacion = null;
    }
  }
});

// 2. Función para solicitar la compilación al iframe
function compilarCodigoMakeCode(codigoTypeScript) {
  return new Promise((resolve, reject) => {
    if (!editorListo) {
      return reject(new Error("El editor MakeCode aún no ha terminado de cargar."));
    }

    resolverCompilacion = (res) => {
      if (res.success && res.outfiles && res.outfiles["binary.hex"]) {
        resolve(res.outfiles["binary.hex"]);
      } else {
        reject(new Error("MakeCode falló al compilar el código."));
      }
    };

    // Estructura del proyecto con soporte Bluetooth
    const proyecto = {
      files: {
        "main.ts": codigoTypeScript,
        "pxt.json": JSON.stringify({
          name: "microbit-sensor-stream",
          dependencies: {
            "core": "*",
            "bluetooth": "*"
          },
          description: "Generado dinámicamente",
          yotta: {
            config: {
              "microbit-dal": {
                "bluetooth": {
                  "pairing_mode": 0 // 0 = No Pairing Required
                }
              }
            }
          }
        })
      }
    };

    iframe.contentWindow.postMessage({
      type: "pxteditor",
      action: "compile",
      project: proyecto,
      response: true
    }, MAKECODE_ORIGIN);
  });
}

// 3. Flasheo WebUSB utilizando el binario obtenido
btn.addEventListener("click", async () => {
  let device = null;
  let target = null;

  try {
    btn.disabled = true;
    progresoContainer.style.display = "block";
    progressBar.value = 0;
    txtEstado.textContent = "Selecciona tu micro:bit en la ventana emergente...";

    // Solicitar permiso WebUSB de inmediato para no perder el gesto del usuario
    device = await navigator.usb.requestDevice({
      filters: [{ vendorId: 0x0d28 }]
    });

    // Código TypeScript a compilar al vuelo
    const scriptTypeScript = `
bluetooth.startAccelerometerService()
basic.showIcon(IconNames.Heart)
`;

    txtEstado.textContent = "Compilando firmware al vuelo con MakeCode...";
    const hexGenerado = await compilarCodigoMakeCode(scriptTypeScript);

    txtEstado.textContent = "Conectando con la placa por USB...";
    const DAP = window.DAPjs || window.dapjs;
    const transport = new DAP.WebUSB(device);
    target = new DAP.DAPLink(transport);

    target.on("progress", (p) => {
      const porcentaje = Math.round(p * 100);
      progressBar.value = porcentaje;
      txtEstado.textContent = `Flasheando micro:bit... ${porcentaje}%`;
    });

    await target.connect();
    txtEstado.textContent = "Escribiendo memoria Flash...";
    const enc = new TextEncoder();
    await target.flash(enc.encode(hexGenerado));

    progressBar.value = 100;
    txtEstado.textContent = "¡micro:bit programado con éxito!";
    alert("¡micro:bit programado con éxito!");
  } catch (err) {
    console.error(err);
    txtEstado.textContent = "Error: " + err.message;
    alert("Error durante la operación: " + err.message);
  } finally {
    if (target) {
      try { await target.disconnect(); } catch (e) {}
    }
    if (device && device.opened) {
      try { await device.close(); } catch (e) {}
    }
    btn.disabled = false;
  }
});
</script>
</body>
</html>
